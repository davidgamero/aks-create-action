version: 2
updates:
   - package-ecosystem: github-actions
     directory: .github/workflows
     schedule:
        interval: weekly
     groups:
        actions:
           applies-to: version-updates
           patterns:
              - '*'
   - package-ecosystem: gomod
     directory: /
     schedule:
        interval: weekly
     groups:
        go-deps:
           applies-to: version-updates
           patterns:
              - '*'
   - package-ecosystem: docker
     directory: /
     schedule:
        interval: weekly
